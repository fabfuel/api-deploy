components:
  schemas:
    ErrorResponse:
      additionalProperties: false
      properties:
        code:
          example: 500
          type: integer
        incident:
          example: 5beb965c-7ffc-468b-a063-eb47c5b366c2
          type: string
        message:
          example: Internal Server Error
          type: string
      required:
      - code
      - message
      - incident
      type: object
    ErrorResponseBadRequest:
      additionalProperties: false
      properties:
        code:
          example: 400
          type: integer
        incident:
          example: 5beb965c-7ffc-468b-a063-eb47c5b366c2
          type: string
        message:
          example: Bad Request
          type: string
      required:
      - code
      - message
      - incident
      type: object
    ErrorResponseNotFound:
      additionalProperties: false
      properties:
        code:
          example: 404
          type: integer
        incident:
          example: 5beb965c-7ffc-468b-a063-eb47c5b366c2
          type: string
        message:
          example: Not Found
          type: string
      required:
      - code
      - message
      - incident
      type: object
    PingPayload:
      additionalProperties: false
      properties:
        _embedded:
          additionalProperties: false
          properties:
            mandatory:
              type: string
            preference:
              type: string
          required:
          - mandatory
          type: object
        _not_required:
          additionalProperties: false
          properties:
            optionalA:
              type: string
            optionalB:
              type: string
          type: object
        _not_strict:
          properties:
            optionalA:
              type: string
            optionalB:
              type: string
          type: object
        category:
          enum:
          - null
          - machine
          - human
          - other
          nullable: true
          type: string
        directions:
          items:
            enum:
            - north
            - east
            - south
            - west
            - '1190'
            - '0119'
            type: string
          type: array
        locations:
          items:
            type: string
          type: array
        ping:
          example: pong
          type: string
        pingAt:
          format: date-time
          type: string
        pingBy:
          example: user@server.com
          type: string
        priority:
          default: 0
          enum:
          - 0
          - 10
          - 20
          - 30
          - 40
          type: integer
      required:
      - ping
      - category
      type: object
    PingPayloadPatch:
      additionalProperties: false
      properties:
        _embedded:
          additionalProperties: false
          properties:
            mandatory:
              type: string
            preference:
              type: string
          type: object
        _not_required:
          additionalProperties: false
          properties:
            optionalA:
              type: string
            optionalB:
              type: string
          type: object
        _not_strict:
          properties:
            optionalA:
              type: string
            optionalB:
              type: string
          type: object
        category:
          enum:
          - null
          - machine
          - human
          - other
          nullable: true
          type: string
        directions:
          items:
            enum:
            - north
            - east
            - south
            - west
            - '1190'
            - '0119'
            type: string
          type: array
        locations:
          items:
            type: string
          type: array
        ping:
          example: pong
          type: string
        pingAt:
          format: date-time
          type: string
        pingBy:
          example: user@server.com
          type: string
        priority:
          default: 0
          enum:
          - 0
          - 10
          - 20
          - 30
          - 40
          type: integer
      type: object
